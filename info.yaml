# Tiny Tapeout project information
project:
  title:        "Direct-Mapped Cache Controller"
  author:       "Vinutha S T"
  discord:      ""
  description:  "A 4-line direct-mapped, write-through cache controller with hit/miss/eviction FSM control logic."
  language:     "Verilog"
  clock_hz:     10000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_vinutha_cache_controller"

  # List your project's source files here.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "request"
  ui[1]: "index_in[0]"
  ui[2]: "index_in[1]"
  ui[3]: "tag_in[0]"
  ui[4]: "tag_in[1]"
  ui[5]: "tag_in[2]"
  ui[6]: "tag_in[3]"
  ui[7]: ""

  # Outputs
  uo[0]: "data_out[0]"
  uo[1]: "data_out[1]"
  uo[2]: "data_out[2]"
  uo[3]: "data_out[3]"
  uo[4]: "data_out[4]"
  uo[5]: "data_out[5]"
  uo[6]: "data_out[6]"
  uo[7]: "data_out[7]"

  # Bidirectional pins
  uio[0]: "mem_data_in[0]"
  uio[1]: "mem_data_in[1]"
  uio[2]: "mem_data_in[2]"
  uio[3]: "mem_data_in[3]"
  uio[4]: "mem_data_in[4]"
  uio[5]: "mem_data_in[5]"
  uio[6]: "mem_data_in[6]"
  uio[7]: "done"

# Do not change!
yaml_version: 6
